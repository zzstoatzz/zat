when:
  - event: ["push", "pull_request"]
    branch: main

engine: nixery

dependencies:
  nixpkgs:
    - curl
    - gnutar
    - xz

steps:
  - name: install zig 0.16
    command: |
      curl -sSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | tar -xJ -C /tangled/workspace
      mv /tangled/workspace/zig-x86_64-linux-0.16.0 /tangled/workspace/.zig

  - name: check formatting
    command: |
      /tangled/workspace/.zig/zig fmt --check .

  - name: run tests
    command: |
      /tangled/workspace/.zig/zig build test --summary all
