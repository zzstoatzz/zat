when:
  - event: ["push"]
    branch: ["main"]
    tag: ["v*"]

engine: nixery

clone:
  depth: 50

dependencies:
  nixpkgs:
    - curl
    - git
    - gnutar
    - xz

steps:
  - name: install zig 0.16
    command: |
      curl -sSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | tar -xJ -C /tangled/workspace
      mv /tangled/workspace/zig-x86_64-linux-0.16.0 /tangled/workspace/.zig

  - name: build and publish docs to ATProto
    command: |
      if [ -z "$ATPROTO_PASSWORD" ]; then
        echo "ATPROTO_PASSWORD is not set; skipping ATProto docs publish"
        exit 0
      fi
      # branch pushes publish only when docs, devlog, or the publish tooling
      # changed; tag pushes always publish. pure shell — grep is not in the image.
      if [ "${TANGLED_REF#refs/tags/}" = "$TANGLED_REF" ]; then
        publish=0
        for f in $(git diff-tree --no-commit-id --name-only -r HEAD); do
          case "$f" in
            README.md|CHANGELOG.md|docs/*|devlog/*|scripts/publish-docs.zig|.tangled/workflows/publish-docs.yml)
              publish=1 ;;
          esac
        done
        if [ "$publish" -eq 0 ]; then
          echo "no docs/devlog changes; skipping ATProto docs publish"
          exit 0
        fi
      fi
      /tangled/workspace/.zig/zig build
      if ! ./zig-out/bin/publish-docs; then
        echo "ATProto docs publish failed; skipping temporarily"
        exit 0
      fi
