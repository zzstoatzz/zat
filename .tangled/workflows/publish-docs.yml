when:
  - event: push
    tag: "v*"

engine: nixery

dependencies:
  nixpkgs:
    - curl
    - gnutar
    - xz

steps:
  - name: install zig 0.16
    command: |
      curl -sSL https://ziglang.org/builds/zig-x86_64-linux-0.16.0-dev.3059+42e33db9d.tar.xz | tar -xJ -C /tangled/workspace
      mv /tangled/workspace/zig-x86_64-linux-0.16.0-dev.3059+42e33db9d /tangled/workspace/.zig

  - name: build and publish docs to ATProto
    command: |
      /tangled/workspace/.zig/zig build
      ./zig-out/bin/publish-docs
