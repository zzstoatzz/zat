<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>From app databases to atproto record projections</title>
  <desc>Diagram comparing an app-owned database exposed through APIs with atproto user repos feeding multiple projections.</desc>
  <rect width="960" height="560" rx="18" fill="#fbfaf7"/>
  <rect x="24" y="24" width="912" height="512" rx="14" fill="#ffffff" stroke="#ded8cc"/>

  <text x="56" y="70" fill="#202124" font-size="28" font-weight="750">records first, apps after</text>
  <text x="56" y="98" fill="#68635b" font-size="15">the useful atproto trick is topology: signed repos can outlive any one projection</text>

  <g transform="translate(56 142)">
    <text x="0" y="0" fill="#8a5b2b" font-size="14" font-weight="700" letter-spacing="0.02em">usual app shape</text>
    <rect x="0" y="22" width="354" height="306" rx="12" fill="#fff7ed" stroke="#ead6bd"/>

    <rect x="92" y="58" width="170" height="54" rx="9" fill="#ffffff" stroke="#d6b68e"/>
    <text x="177" y="91" text-anchor="middle" fill="#523512" font-size="17" font-weight="700">app</text>

    <path d="M177 112 L177 152" stroke="#b7772e" stroke-width="3" marker-end="url(#arrow-orange)"/>

    <rect x="78" y="152" width="198" height="74" rx="10" fill="#fff" stroke="#d6b68e"/>
    <text x="177" y="182" text-anchor="middle" fill="#523512" font-size="16" font-weight="700">private database</text>
    <text x="177" y="205" text-anchor="middle" fill="#8a6f52" font-size="13">schema, ranking, policy</text>

    <path d="M177 226 L177 266" stroke="#b7772e" stroke-width="3" marker-end="url(#arrow-orange)"/>

    <rect x="78" y="266" width="198" height="38" rx="8" fill="#fff" stroke="#d6b68e"/>
    <text x="177" y="291" text-anchor="middle" fill="#523512" font-size="15" font-weight="650">API clients</text>
  </g>

  <g transform="translate(466 142)">
    <text x="0" y="0" fill="#106655" font-size="14" font-weight="700" letter-spacing="0.02em">atproto shape</text>
    <rect x="0" y="22" width="414" height="306" rx="12" fill="#f2f8f5" stroke="#cde1d8"/>

    <g transform="translate(34 52)">
      <rect x="0" y="0" width="92" height="64" rx="10" fill="#ffffff" stroke="#9ec9bb"/>
      <text x="46" y="28" text-anchor="middle" fill="#174d43" font-size="15" font-weight="700">user repo</text>
      <text x="46" y="48" text-anchor="middle" fill="#5f8077" font-size="12">signed records</text>
    </g>
    <g transform="translate(160 52)">
      <rect x="0" y="0" width="92" height="64" rx="10" fill="#ffffff" stroke="#9ec9bb"/>
      <text x="46" y="28" text-anchor="middle" fill="#174d43" font-size="15" font-weight="700">user repo</text>
      <text x="46" y="48" text-anchor="middle" fill="#5f8077" font-size="12">signed records</text>
    </g>
    <g transform="translate(286 52)">
      <rect x="0" y="0" width="92" height="64" rx="10" fill="#ffffff" stroke="#9ec9bb"/>
      <text x="46" y="28" text-anchor="middle" fill="#174d43" font-size="15" font-weight="700">user repo</text>
      <text x="46" y="48" text-anchor="middle" fill="#5f8077" font-size="12">signed records</text>
    </g>

    <path d="M80 116 C80 144 207 144 207 170" stroke="#168c7a" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
    <path d="M206 116 L206 170" stroke="#168c7a" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
    <path d="M332 116 C332 144 207 144 207 170" stroke="#168c7a" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>

    <rect x="114" y="170" width="186" height="52" rx="10" fill="#ffffff" stroke="#9ec9bb"/>
    <text x="207" y="202" text-anchor="middle" fill="#174d43" font-size="16" font-weight="700">relay / firehose</text>

    <path d="M207 222 C207 248 70 248 70 270" stroke="#168c7a" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
    <path d="M207 222 L207 270" stroke="#168c7a" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
    <path d="M207 222 C207 248 344 248 344 270" stroke="#168c7a" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>

    <g transform="translate(12 270)">
      <rect x="0" y="0" width="116" height="42" rx="8" fill="#ffffff" stroke="#9ec9bb"/>
      <text x="58" y="27" text-anchor="middle" fill="#174d43" font-size="14" font-weight="650">social app</text>
    </g>
    <g transform="translate(149 270)">
      <rect x="0" y="0" width="116" height="42" rx="8" fill="#ffffff" stroke="#9ec9bb"/>
      <text x="58" y="27" text-anchor="middle" fill="#174d43" font-size="14" font-weight="650">search</text>
    </g>
    <g transform="translate(286 270)">
      <rect x="0" y="0" width="116" height="42" rx="8" fill="#ffffff" stroke="#9ec9bb"/>
      <text x="58" y="27" text-anchor="middle" fill="#174d43" font-size="14" font-weight="650">archive</text>
    </g>
  </g>

  <g transform="translate(56 498)">
    <text x="0" y="0" fill="#68635b" font-size="13">apps still matter. the point is that their data source can be shared, signed, copied, indexed, and verified.</text>
  </g>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b7772e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#168c7a"/>
    </marker>
  </defs>
</svg>
