<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Arial, Helvetica, sans-serif">
  <title>Zat and Atmos MST benchmark throughput</title>
  <desc>Grouped horizontal bar chart comparing Zat and Atmos insert plus root throughput and lookup throughput. Zat is 1.38 times faster on insert plus root and 1.19 times faster on lookup.</desc>

  <rect width="960" height="520" rx="18" fill="#fbfaf7"/>
  <rect x="24" y="24" width="912" height="472" rx="14" fill="#ffffff" stroke="#ded8cc"/>

  <text x="56" y="68" fill="#202124" font-size="28" font-weight="700">MST hot path after matching Atmos semantics</text>
  <text x="56" y="94" fill="#68635b" font-size="15">50k deterministic records, 500k lookups/pass, median of 3 official atproto-bench runs</text>

  <g transform="translate(56 124)">
    <rect x="0" y="0" width="404" height="86" rx="10" fill="#f2f7f4" stroke="#cfe1d8"/>
    <text x="22" y="32" fill="#1b4f45" font-size="15" font-weight="700">same work, same tree</text>
    <text x="22" y="58" fill="#46615b" font-size="14">both implementations produced identical root bytes</text>
    <text x="22" y="77" fill="#73817c" font-size="11" font-family="Menlo, Consolas, monospace">01711220d59a82ff...e8cbc579221c8c2e</text>
  </g>

  <g transform="translate(500 124)">
    <rect x="0" y="0" width="184" height="86" rx="10" fill="#eef6fb" stroke="#c8ddea"/>
    <text x="18" y="32" fill="#0f4b66" font-size="15" font-weight="700">insert + root</text>
    <text x="18" y="65" fill="#0f4b66" font-size="34" font-weight="700">1.38x</text>
  </g>
  <g transform="translate(704 124)">
    <rect x="0" y="0" width="176" height="86" rx="10" fill="#fff4e7" stroke="#edd4ad"/>
    <text x="18" y="32" fill="#7b4a13" font-size="15" font-weight="700">lookup</text>
    <text x="18" y="65" fill="#7b4a13" font-size="34" font-weight="700">1.19x</text>
  </g>

  <g transform="translate(56 250)">
    <text x="0" y="-18" fill="#68635b" font-size="13">throughput, millions of operations per second</text>

    <line x1="188" y1="0" x2="808" y2="0" stroke="#eee8dd"/>
    <line x1="188" y1="64" x2="808" y2="64" stroke="#eee8dd"/>
    <line x1="188" y1="128" x2="808" y2="128" stroke="#eee8dd"/>

    <g fill="#aaa39a" font-size="12">
      <text x="188" y="164" text-anchor="middle">0</text>
      <text x="365" y="164" text-anchor="middle">2M</text>
      <text x="542" y="164" text-anchor="middle">4M</text>
      <text x="719" y="164" text-anchor="middle">6M</text>
    </g>

    <g stroke="#eee8dd">
      <line x1="188" y1="-14" x2="188" y2="142"/>
      <line x1="365" y1="-14" x2="365" y2="142"/>
      <line x1="542" y1="-14" x2="542" y2="142"/>
      <line x1="719" y1="-14" x2="719" y2="142"/>
    </g>

    <text x="0" y="38" fill="#202124" font-size="17" font-weight="700">insert + root</text>
    <text x="0" y="102" fill="#202124" font-size="17" font-weight="700">lookup</text>

    <g>
      <rect x="188" y="10" width="507" height="20" rx="5" fill="#168c7a"/>
      <rect x="188" y="36" width="367" height="20" rx="5" fill="#d07b28"/>
      <text x="683" y="26" text-anchor="end" fill="#ffffff" font-size="14" font-weight="700">Zat 5.73M records/sec</text>
      <text x="543" y="52" text-anchor="end" fill="#ffffff" font-size="14" font-weight="700">Atmos 4.15M records/sec</text>
    </g>

    <g>
      <rect x="188" y="74" width="579" height="20" rx="5" fill="#168c7a"/>
      <rect x="188" y="100" width="488" height="20" rx="5" fill="#d07b28"/>
      <text x="755" y="90" text-anchor="end" fill="#ffffff" font-size="14" font-weight="700">Zat 6.54M lookups/sec</text>
      <text x="664" y="116" text-anchor="end" fill="#ffffff" font-size="14" font-weight="700">Atmos 5.51M lookups/sec</text>
    </g>
  </g>

  <g transform="translate(56 456)">
    <rect x="0" y="-12" width="14" height="14" rx="3" fill="#168c7a"/>
    <text x="22" y="0" fill="#494640" font-size="13">Zat</text>
    <rect x="70" y="-12" width="14" height="14" rx="3" fill="#d07b28"/>
    <text x="92" y="0" fill="#494640" font-size="13">Atmos</text>
    <text x="202" y="0" fill="#80786d" font-size="13">apples-to-apples benchmark: one selected Zat path, one Atmos path</text>
  </g>
</svg>
